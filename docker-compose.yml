services:
  api:
    build: .
    command: sh -c "node dist/db/migrate.js && node dist/server.js"
    ports: ["3000:3000"]
    env_file: .env
    depends_on: [postgres, redis]
  worker:
    build: .
    command: sh -c "node dist/db/migrate.js && node dist/workers/verification.worker.js"
    env_file: .env
    volumes: ["whatsapp_auth:/app/.wwebjs_auth"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whatsapp_verifier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
volumes:
  postgres_data:
  redis_data:
  whatsapp_auth:
