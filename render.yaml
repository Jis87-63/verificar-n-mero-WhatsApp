services:
  - type: web
    name: whatsapp-verifier-api
    runtime: docker
    dockerCommand: sh -c "node dist/db/migrate.js && node dist/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: whatsapp-verifier-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: whatsapp-verifier-redis, property: connectionString }
      - key: API_KEY
        generateValue: true
  - type: redis
    name: whatsapp-verifier-redis
    plan: free
    ipAllowList: []
  - type: worker
    name: whatsapp-verifier-worker
    runtime: docker
    dockerCommand: sh -c "node dist/db/migrate.js && node dist/workers/verification.worker.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: whatsapp-verifier-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: whatsapp-verifier-redis, property: connectionString }
      - key: API_KEY
        sync: false
databases:
  - name: whatsapp-verifier-db
    plan: basic-256mb
